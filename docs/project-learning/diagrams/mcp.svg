<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720"><rect width="1280" height="720" fill="#121417"/><style>text{font-family:'Microsoft YaHei',Arial;fill:#F7F7F5}.t{font-size:28px;font-weight:700}.b{font-size:16px}.m{font-family:Consolas;font-size:13px}.n{fill:#1E1E1E;stroke:#4B5563;stroke-width:2}.a{stroke:#F59E0B}.g{stroke:#22C55E}.l{stroke:#8C98A4;stroke-width:3;fill:none;marker-end:url(#x)}</style><defs><marker id="x" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#8C98A4"/></marker></defs><text x="50" y="54" class="t">MCP 工具从 Server 到 Agent</text><rect x="60" y="120" width="190" height="80" rx="7" class="n"/><text x="155" y="150" text-anchor="middle" class="b">Configuration</text><text x="155" y="177" text-anchor="middle" class="m">legacy / DBHub / MarkItDown / Feishu</text><rect x="300" y="120" width="210" height="80" rx="7" class="n a"/><text x="405" y="150" text-anchor="middle" class="b">每 Server 单独构造</text><text x="405" y="177" text-anchor="middle" class="m">stdio / streamable_http</text><rect x="560" y="120" width="210" height="80" rx="7" class="n"/><text x="665" y="150" text-anchor="middle" class="b">MultiServerMCPClient</text><text x="665" y="177" text-anchor="middle" class="m">get_tools()</text><rect x="820" y="120" width="190" height="80" rx="7" class="n a"/><text x="915" y="150" text-anchor="middle" class="b">Wrapper</text><text x="915" y="177" text-anchor="middle" class="m">server__name on conflict</text><rect x="1060" y="120" width="170" height="80" rx="7" class="n g"/><text x="1145" y="150" text-anchor="middle" class="b">Metadata</text><text x="1145" y="177" text-anchor="middle" class="m">domain + mcp_server</text><path d="M250 160H300M510 160H560M770 160H820M1010 160H1060" class="l"/><rect x="290" y="330" width="240" height="95" rx="7" class="n"/><text x="410" y="365" text-anchor="middle" class="b">get_all_tools</text><text x="410" y="395" text-anchor="middle" class="m">built-ins + retrieval + MCP</text><rect x="650" y="330" width="240" height="95" rx="7" class="n"/><text x="770" y="365" text-anchor="middle" class="b">role domain filter</text><text x="770" y="395" text-anchor="middle" class="m">AgentSpec.allowed_domains</text><rect x="1000" y="330" width="200" height="95" rx="7" class="n g"/><text x="1100" y="365" text-anchor="middle" class="b">bind_tools</text><text x="1100" y="395" text-anchor="middle" class="m">AgentRuntime</text><path d="M1145 200C1145 270 410 260 410 330M530 377H650M890 377H1000" class="l"/><text x="70" y="565" class="m">故障隔离：每个 Server 的 build/connect/get_tools 都在独立 try/except 中，失败只跳过该 Server</text><text x="70" y="605" class="m">冲突策略：不静默丢工具；仅在重名时生成 server__tool，保留原 coroutine / schema / metadata</text></svg>
