[project]
name = "open_deep_research"
version = "0.0.16"
description = "Planning, research, and report generation."
authors = [
    { name = "Lance Martin" }
]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "langchain-core>=1.2.22,<2.0.0",
    "langchain-classic>=1.0.0,<2.0.0",
    "langchain-community>=0.3.9",
    "langchain-openai>=0.3.28",
    "langchain-anthropic>=0.3.15",
    "langchain-mcp-adapters>=0.1.6",
    "langchain-deepseek>=0.1.2",
    "langchain-groq>=0.2.4",
    "openai>=1.99.2",
    "openai-agents==0.24.0",
    "dbos[otel]==3.3.0",
    "psycopg[binary]==3.3.6",
    "jsonschema>=4.24.0,<5",
    "tavily-python>=0.5.0",
    "pymupdf>=1.25.3",
    "python-dotenv>=1.0.1",
    "httpx>=0.24.0",
    "langsmith>=0.3.37",
    "langchain-google-vertexai>=2.0.25",
    "langchain-google-genai>=2.1.5",
    "mcp>=1.9.4",
    "markitdown-mcp>=0.0.1a4",
    "langchain-aws>=0.2.28",
    "sentence-transformers>=3.0.0",
    "pymilvus>=2.4.0",
    "faiss-cpu>=1.8.0",
    "pillow>=10.0.0",
    "pytesseract>=0.3.10",
    "sqlalchemy>=2.0.0",
    "pymysql>=1.1.1",
    "neo4j>=5.20.0",
    "neo4j-graphrag>=1.19.0,<2.0.0",
    "fastapi>=0.138.0",
    "uvicorn>=0.34.3",
    "langfuse>=4.18,<5",
    "openinference-instrumentation-openai-agents==2.6.0",
    "opentelemetry-sdk>=1.39,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.39,<2",
]

[project.optional-dependencies]
dev = ["mypy>=1.11.1", "ruff>=0.6.1", "pytest", "pytest-benchmark>=5.2.3", "pytest-socket>=0.7.0", "pyyaml>=6.0.2"]
notebooks = ["ipykernel>=6.29.5"]
# Keep the install extra; FastAPI and plain Uvicorn are already base requirements.
web = ["uvicorn[standard]>=0.34.3"]

[project.scripts]
social-media-mcp = "open_deep_research.social_media_mcp:main"
apify-social-api = "open_deep_research.social_media_apify_api:main"
deep-research-web = "open_deep_research.web.server:main"
deep-research = "open_deep_research.web.cli:main"
deep-research-executor = "open_deep_research.web.executor:main"

[build-system]
requires = ["setuptools>=73.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["open_deep_research*"]
exclude = ["*.tests", "*.tests.*"]
namespaces = true

[tool.setuptools.package-data]
"*" = ["py.typed"]
"open_deep_research.web" = ["static/*", "studio/index.html", "studio/assets/*"]

[tool.ruff]
cache-dir = ".tmp/ruff-cache"
extend-exclude = ["*.ipynb"]
lint.select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # isort
    "D",    # pydocstyle
    "D401", # First line should be in imperative mood
    "T201",
    "UP",
]
lint.ignore = [
    "UP006",
    "UP007",
    "UP035",
    "D417",
    "E501",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "UP"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest.ini_options]
testpaths = ["tests"]
cache_dir = ".tmp/pytest-cache"
addopts = ["--strict-markers", "-m", "not integration", "--benchmark-storage=file://./.tmp/benchmarks"]
markers = [
    "integration: requires network access, downloaded models, or external infrastructure",
]

[tool.mypy]
cache_dir = "${MYPY_CONFIG_FILE_DIR}/.tmp/mypy-cache"

[tool.uv]
# markitdown-mcp pins mcp~=1.8.0 but langchain-mcp-adapters needs mcp>=1.9.2.
# Override to let uv resolve both together — markitdown-mcp is only invoked
# as a subprocess (uv run markitdown-mcp) and is disabled by default.
override-dependencies = ["mcp>=1.9.4"]
