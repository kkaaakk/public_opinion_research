[project]
name = "opinion-deerflow-extension"
version = "0.1.0"
description = "Public Opinion Research adapter for the official DeerFlow extension contract"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "deerflow-extension-api>=0.2.7,<0.3",
    "opinion-business==0.1.0",
]

[project.entry-points."deerflow.extensions"]
opinion = "opinion_deerflow_extension:install"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["opinion_deerflow_extension"]

[tool.ruff]
line-length = 120
target-version = "py312"
