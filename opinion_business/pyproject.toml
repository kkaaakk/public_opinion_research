[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "opinion-business"
version = "0.1.0"
description = "Runtime-independent public opinion business contracts"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = []

[tool.hatch.build.targets.wheel]
packages = ["opinion_business"]

[tool.ruff]
target-version = "py312"
line-length = 120
