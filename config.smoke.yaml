# Low-cost end-to-end test configuration.
#
# It inherits every field from config.yaml and changes only what is needed for a
# first real run. The execution chain is unchanged: RunClient -> DBOSClient ->
# PostgreSQL/DBOS Queue -> Executor -> POR Workflow -> Agents SDK.
#
# This file must never become the production configuration, and changes here
# cannot leak into `por run`, which always loads config.yaml.

extends: config.yaml

# One bounded research round; no gap follow-up or Brief approval.
max_research_rounds: 1
# This caps SDK turns, not searches. Two turns cannot finish one
# "search + read the results + answer" cycle, and even six turns leave no
# synthesis turn after the searches, so the role report degraded to the raw
# tool-call text. Ten turns keep 6-8 search turns plus a synthesis turn.
max_react_tool_calls: 10
max_content_length: 8000
max_structured_output_retries: 2
workflow_step_timeout_seconds: 900
allow_clarification: false
allow_plan_feedback: false

# Smaller hard ceilings while keeping the final-report reservation. Tool and
# search allowances cover six productive turns; the model ceiling still bounds
# the whole Run, so smoke stays a cheap single-round check.
# Each web_search summarizes up to MAX_SUMMARIZED_PAGES_PER_CALL (8) pages, so
# one search can cost up to eight nested model attempts. With max_search_calls
# 10 the page summaries alone can reach 80 attempts, so the model ceiling has
# to stay consistent with the search ceiling instead of tripping the reserve
# mid-round. The summarizer is a mini model, so the round stays cheap.
# Output caps stay inherited from config.yaml: real deepseek-flash output also
# carries reasoning tokens, so the formal 16384 caps are the ones smoke uses.
# Process-level tracing only applies when this file starts its own Executor;
# a shared Executor keeps the formal config.yaml tracing state.
tracing_enabled: false
budget_enabled: true
max_model_calls: 96
max_tool_calls: 20
max_search_calls: 10
max_input_tokens: 800000
max_output_tokens: 80000
budget_warning_ratio: 0.8
reserve_final_report_call: true

# Web-only smoke research: no local index build, OCR, vision or plugin MCP.
rag_enabled: false
retrieval_mode: web_only
rag_multimodal_enabled: false
rag_vision_enabled: false
rag_query_image_enabled: false
rag_query_rewrite_enabled: false
enabled_business_agents:
  - public_signal
  - risk_assessment
  - response_strategy
enabled_plugins: []
