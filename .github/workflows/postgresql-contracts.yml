name: PostgreSQL Contracts

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dbos-integration:
    name: dbos-postgresql-contracts
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_USER: por_execution
          POSTGRES_PASSWORD: ci-dbos-test-only
          POSTGRES_DB: por_execution
        ports: ["5432:5432"]
        options: >-
          --label por-integration=dbos-phase4
          --health-cmd "pg_isready -U por_execution -d por_execution"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      PYTHON_DOTENV_DISABLED: "1"
      OPENAI_AGENTS_DISABLE_TRACING: "1"
      LANGSMITH_TRACING: "false"
      TEST_DBOS_DATABASE_URL: postgresql+psycopg://por_execution:ci-dbos-test-only@127.0.0.1:5432/por_execution
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --extra dev --locked
      - name: Native workflows, SDK contracts and real process faults
        env:
          TEST_DBOS_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: >-
          uv run python -m pytest -m integration
          tests/test_brief_dbos.py tests/test_dbos_contracts.py tests/test_dbos_process.py tests/test_dbos_retry.py
          tests/test_telemetry_dbos.py
          tests/test_dbosrunner.py
          tests/test_dbosrunner_migration.py tests/test_dbosrunner_report.py
          tests/test_dbosrunner_receipts.py
          tests/test_web_history.py tests/test_p1_fixes.py
          --disable-socket --allow-unix-socket --allow-hosts=127.0.0.1,::1
