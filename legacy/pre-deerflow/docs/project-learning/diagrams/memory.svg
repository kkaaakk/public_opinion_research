<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720"><rect width="1280" height="720" fill="#F7F7F5"/><style>text{font-family:'Microsoft YaHei',Arial;fill:#121417}.t{font-size:28px;font-weight:700}.b{font-size:16px}.m{font-family:Consolas;font-size:13px}.n{fill:#fff;stroke:#3B82F6;stroke-width:2}.o{fill:#fff7e6;stroke:#F59E0B;stroke-width:2}.l{stroke:#69737D;stroke-width:3;fill:none;marker-end:url(#x)}.d{stroke-dasharray:8 7}</style><defs><marker id="x" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#69737D"/></marker></defs><text x="50" y="52" class="t">Memory Architecture：三种“记忆”不要混在一起</text><rect x="70" y="110" width="280" height="120" rx="8" class="n"/><text x="210" y="150" text-anchor="middle" class="b">Graph State</text><text x="210" y="181" text-anchor="middle" class="m">messages + agents + report</text><text x="210" y="207" text-anchor="middle" class="m">本次 invoke 生命周期</text><rect x="500" y="110" width="280" height="120" rx="8" class="o"/><text x="640" y="150" text-anchor="middle" class="b">Agent 私有记忆</text><text x="640" y="181" text-anchor="middle" class="m">memory[-5:] + rolling_summary</text><text x="640" y="207" text-anchor="middle" class="m">agents_reducer 按 role 合并</text><rect x="930" y="110" width="280" height="120" rx="8" class="n"/><text x="1070" y="150" text-anchor="middle" class="b">Checkpointer</text><text x="1070" y="181" text-anchor="middle" class="m">生产 compile 未挂载</text><text x="1070" y="207" text-anchor="middle" class="m">测试/评测显式 MemorySaver</text><path d="M350 170H500M780 170H930" class="l d"/><rect x="180" y="380" width="300" height="130" rx="8" class="n"/><text x="330" y="420" text-anchor="middle" class="b">Long-term MySQL Memory</text><text x="330" y="452" text-anchor="middle" class="m">chat_raw / summary / facts</text><text x="330" y="480" text-anchor="middle" class="m">conversation_id + user_id</text><rect x="650" y="380" width="300" height="130" rx="8" class="o"/><text x="800" y="420" text-anchor="middle" class="b">RAG index copy</text><text x="800" y="452" text-anchor="middle" class="m">indexable types only</text><text x="800" y="480" text-anchor="middle" class="m">pending → indexed</text><path d="M480 445H650" class="l"/><text x="70" y="630" class="m">启用条件：rag_memory_write_enabled + rag_memory_mysql_url；写入失败 fail-open，不中断最终报告</text></svg>
