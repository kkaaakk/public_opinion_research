name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install locked project and development tools
        run: uv sync --extra dev --locked

      - name: Ruff active source
        run: >-
          uv run python -m ruff check --select E,F,I --ignore E501
          src/open_deep_research tests/conftest.py tests/test_*.py

      - name: Compile active source
        run: uv run python -m compileall -q src/open_deep_research

      - name: Import public runtime boundaries
        run: >-
          uv run python -c "import open_deep_research;
          import open_deep_research.deep_researcher;
          import open_deep_research.runtime;
          import open_deep_research.rag;
          import open_deep_research.social_media_mcp"

  tests:
    name: tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install locked project
        run: uv sync --locked

      - name: Run deterministic offline tests
        run: uv run python -m pytest
