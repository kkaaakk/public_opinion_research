# 本地研究图数据库：仅监听回环地址，凭据由环境文件提供。
name: public-opinion-research

services:
  neo4j:
    image: neo4j:5.26.31
    container_name: public-opinion-neo4j
    restart: unless-stopped
    # HTTP 管理界面与 Bolt 驱动端口只向本机开放。
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    environment:
      NEO4J_AUTH: "neo4j/${RESEARCH_GRAPH_PASSWORD:?Set RESEARCH_GRAPH_PASSWORD in .env}"
      NEO4J_server_memory_heap_initial__size: "256m"
      NEO4J_server_memory_heap_max__size: "512m"
      NEO4J_server_memory_pagecache_size: "256m"
    # 数据和日志使用命名卷，在容器重建后保留。
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    # 用数据库查询确认服务已就绪，密码在容器中展开。
    healthcheck:
      test:
        - CMD-SHELL
        - 'cypher-shell -a bolt://localhost:7687 -u neo4j -p "$${NEO4J_AUTH#*/}" "RETURN 1;" >/dev/null 2>&1'
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 40s

volumes:
  neo4j_data:
  neo4j_logs:
